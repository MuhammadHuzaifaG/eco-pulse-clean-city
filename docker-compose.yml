version: '3.8'

services:
  # Python FastAPI AI Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecopulse-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Frontend Web Server
  frontend:
    image: nginx:alpine
    container_name: ecopulse-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      - backend